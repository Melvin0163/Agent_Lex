name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies (no torch, no model downloads)
        run: pip install -r requirements-test.txt
      - name: Run unit tests
        run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t lexagent:ci .
